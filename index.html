<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Nur Farzana Yusrina! 🎉</title>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --dark-matcha: #3d5e2d;
      --soft-pink: #fbb1bd;
      --accent-pink: #ff85a1;
      --light-cream: #fef8f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px 8% 20px 20px;
      overflow-x: hidden;

      /* Page 1 Background */
      background-image: url('bg.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      transition: background 0.5s ease;
    }

    html {
      height: -webkit-fill-available;
    }

    .hidden {
      display: none !important;
    }

    /* --- PAGE 1: PASSCODE LOCK --- */
    .opening-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      margin-left: auto;
    }

    .lock-box {
      background: rgba(254, 248, 243, 0.94);
      backdrop-filter: blur(8px);
      border: 3px solid #789c67;
      padding: 16px 14px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
      width: 100%;
      max-width: 250px;
    }

    .lock-box h2 {
      color: var(--dark-matcha);
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .lock-box p {
      color: #555;
      font-size: 0.75rem;
      margin-bottom: 14px;
    }

    .pin-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pin-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--dark-matcha);
      transition: all 0.2s ease;
    }

    .pin-dot.filled {
      background-color: var(--accent-pink);
      border-color: var(--accent-pink);
      transform: scale(1.15);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      justify-items: center;
    }

    .key-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #f7e3e7;
      color: var(--dark-matcha);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.08);
      transition: all 0.15s ease;
    }

    .key-btn:active {
      background-color: var(--accent-pink);
      color: white;
      transform: scale(0.92);
    }

    .error-msg {
      color: #ff4d6d;
      font-size: 0.8rem;
      margin-top: 10px;
      height: 16px;
      font-weight: bold;
    }

    /* --- PAGE 2: MUSIC & FLOATING ELEMENTS SCREEN --- */
    .page-two-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 40px;
      overflow: hidden;
    }

    /* Play/Pause Button */
    .play-btn {
      background: var(--accent-pink);
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .play-btn:hover {
      background-color: #f76c8e;
      transform: scale(1.05);
    }

    /* Speech Bubble Stickers */
    .floating-icon {
      position: absolute;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      border: 4px solid #ffffff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.28);
      transition: transform 0.25s ease;
      background: #ffffff;
      z-index: 10;
    }

    .floating-icon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 18px;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 14px solid #ffffff;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.15));
    }

    .floating-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .floating-icon:hover {
      transform: scale(1.18) rotate(6deg) !important;
    }

    /* --- DYNAMIC MOVEMENT ANIMATIONS --- */
    .icon-top-left {
      top: 15%;
      left: 8%;
      animation: moveEverywhere1 12s ease-in-out infinite alternate;
    }

    .icon-bottom-left {
      bottom: 20%;
      left: 8%;
      animation: moveEverywhere2 14s ease-in-out infinite alternate;
    }

    .icon-bottom-right {
      bottom: 22%;
      right: 8%;
      animation: moveEverywhere3 10s ease-in-out infinite alternate;
    }

    @keyframes moveEverywhere1 {
      0% {
        transform: translate(0, 0) rotate(-6deg);
      }
      25% {
        transform: translate(35px, 25px) rotate(4deg);
      }
      50% {
        transform: translate(-20px, 50px) rotate(-8deg);
      }
      75% {
        transform: translate(45px, 10px) rotate(6deg);
      }
      100% {
        transform: translate(-10px, -20px) rotate(-4deg);
      }
    }

    @keyframes moveEverywhere2 {
      0% {
        transform: translate(0, 0) rotate(4deg);
      }
      30% {
        transform: translate(-25px, -45px) rotate(-6deg);
      }
      60% {
        transform: translate(40px, -20px) rotate(8deg);
      }
      100% {
        transform: translate(15px, 30px) rotate(-3deg);
      }
    }

    @keyframes moveEverywhere3 {
      0% {
        transform: translate(0, 0) rotate(-5deg);
      }
      35% {
        transform: translate(-45px, -35px) rotate(7deg);
      }
      70% {
        transform: translate(20px, -50px) rotate(-6deg);
      }
      100% {
        transform: translate(-25px, 20px) rotate(3deg);
      }
    }

    /* --- POPUP MESSAGE MODAL --- */
    .message-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .message-card {
      background: var(--light-cream);
      padding: 28px 24px 24px 24px;
      border-radius: 28px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
      border: 3.5px solid var(--accent-pink);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      color: var(--dark-matcha);
      animation: popIn 0.3s ease;
    }

    .modal-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 18px;
      margin: 12px 0 16px 0;
      border: 3px solid var(--soft-pink);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
      transition: all 0.2s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .message-card h2 {
      color: var(--accent-pink);
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .message-card p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #444;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 14px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    /* --- GENERAL MOBILE RESPONSIVE FIXES --- */
    @media (max-width: 768px) {
      body {
        padding: 15px;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 40px;
      }

      .opening-container {
        justify-content: center;
        margin-left: 0;
      }

      .lock-box {
        max-width: 230px;
        padding: 14px 12px;
      }

      .key-btn {
        width: 44px;
        height: 44px;
        font-size: 1rem;
      }
    }

    /* --- IPHONE & MOBILE BUBBLE STICKERS --- */
    @media only screen and (min-device-width: 375px) and (max-device-width: 440px) {
      .floating-icon {
        width: 78px;
        height: 78px;
        border-width: 3.5px;
      }
    }
  </style>
</head>
<body>

  <!-- PAGE 1: PASSCODE -->
  <div class="opening-container">
    <div class="lock-box">
      <h2>🍓 Secret Lock 🍵</h2>
      <p>Enter your birthday (DDMM)</p>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" onclick="clearPin()">❌</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="deleteLast()">⌫</button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <!-- AUDIO FILE -->
  <audio id="bgMusic" src="Taylor Swift  22 (Lyrics).mp3" loop></audio>

  <!-- PAGE 2: MUSIC & FLOATING ELEMENTS -->
  <div class="page-two-container hidden" id="pageTwo">

    <!-- Dynamic Speech Bubble Stickers -->
    <div class="floating-icon icon-top-left" onclick="openMessage(1)">
      <img src="💚💗.jpeg" alt="Envelope Note">
    </div>

    <div class="floating-icon icon-bottom-left" onclick="openMessage(3)">
      <img src="matcha.jpeg" alt="I Love You So Matcha">
    </div>

    <div class="floating-icon icon-bottom-right" onclick="openMessage(4)">
      <img src="polaroid.jpg" alt="Precious moments!">
    </div>

    <!-- Play/Pause Control Button -->
    <button class="play-btn" id="playBtn" onclick="toggleMusic()">▶ Play Song</button>
  </div>

  <!-- POPUP MESSAGE MODAL -->
  <div class="message-modal hidden" id="msgModal">
    <div class="message-card">
      <span class="close-btn" onclick="closeMessage()">&times;</span>
      <h2 id="modalTitle">Happy Birthday! 🍓✨</h2>
      <img id="modalImage" class="modal-img hidden" src="" alt="Popup Image">
      <p id="modalText">Mesej khas untuk Farzana...</p>
    </div>
  </div>

  <script>
    const CORRECT_PIN = "2309"; // 23 September
    let currentInput = "";

    const errorMsg = document.getElementById('errorMsg');
    const openingContainer = document.querySelector('.opening-container');
    const pageTwo = document.getElementById('pageTwo');
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');

    let isPlaying = false;

    const messages = {
      1: {
        title: "Birthday Wish 💌",
        text: "happiest birthday to u zanss!feeling twenty-two x? HAHAHAHAHAHA. sweet 22 bestieee!💚 omg aku la paling excited because i made this for u bday girl hehe likee maybe aku xda kerja lain kali dlm office tok HAHAHAH but anyways, enjoy ur bday with u mom okies! stay healthy and pretty as always love. glad to have u as my girl bestfriend ever whenever aku kau susah senang alhamdulillah! and YESS PROUD OF U DEANS LIST AGAIN n we made it again gorll!! for future endeavours that i hope we can make a lot of money and get married with partner pilihan masing omg ady imagine wedding planner kacak2 hehe but first grad degree first with first class together! last but not least, this semester insha allah dipermudahkan and dapat kerja yang tetap lepas intern aamin! HAPPY BIRTHDAY FARZANAA!  🍓💚"
      },
      3: {
        title: "I Love You So Matcha 🍵",
        image: "matcha.jpeg",
        text: "Here's to endless matcha dates, gossips, and creating countless core memories together!"
      },
      4: {
        title: "fav gmbr 📸",
        image: "convo.jpg",
        text: "LETS GRADUATE WITH 1ST CLASS!"
      }
    };

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentInput.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    function pressKey(num) {
      if (currentInput.length < 4) {
        currentInput += num;
        updateDots();
        errorMsg.textContent = "";

        if (currentInput.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }

    function clearPin() {
      currentInput = "";
      updateDots();
      errorMsg.textContent = "";
    }

    function deleteLast() {
      currentInput = currentInput.slice(0, -1);
      updateDots();
      errorMsg.textContent = "";
    }

    function verifyPin() {
      if (currentInput === CORRECT_PIN) {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#ff85a1', '#fbb1bd', '#789c67', '#fef8f3']
        });

        openingContainer.classList.add('hidden');
        pageTwo.classList.remove('hidden');

        document.body.style.justifyContent = 'center';
        document.body.style.padding = '0';
        document.body.style.backgroundImage = "url('vinyl bg.png')";
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center top";

        // --- AUTO-PLAY MUSIC UPON UNLOCKING ---
        bgMusic.play().then(() => {
          isPlaying = true;
          playBtn.textContent = "❚❚ Pause Song";
        }).catch(error => {
          console.log("Autoplay blocked by browser policy:", error);
        });

      } else {
        errorMsg.textContent = "Wrong date! Try again 🍓";
        clearPin();
      }
    }

    function toggleMusic() {
      if (isPlaying) {
        bgMusic.pause();
        playBtn.textContent = "▶ Play Song";
      } else {
        bgMusic.play();
        playBtn.textContent = "❚❚ Pause Song";
      }
      isPlaying = !isPlaying;
    }

    function openMessage(id) {
      confetti({
        particleCount: 60,
        spread: 60,
        origin: { y: 0.5 }
      });

      const msgData = messages[id];
      const modalImg = document.getElementById('modalImage');

      document.getElementById('modalTitle').textContent = msgData.title;
      document.getElementById('modalText').textContent = msgData.text;

      if (msgData.image) {
        modalImg.src = msgData.image;
        modalImg.classList.remove('hidden');

        if (id === 3) {
          modalImg.style.objectFit = 'contain';
          modalImg.style.backgroundColor = '#ffffff';
          modalImg.style.objectPosition = 'center';
        } else if (id === 4) {
          modalImg.style.objectFit = 'cover';
          modalImg.style.backgroundColor = 'transparent';
          modalImg.style.objectPosition = 'center 80%';
        } else {
          modalImg.style.objectFit = 'cover';
          modalImg.style.backgroundColor = 'transparent';
          modalImg.style.objectPosition = 'center';
        }
      } else {
        modalImg.classList.add('hidden');
      }

      document.getElementById('msgModal').classList.remove('hidden');
    }

    function closeMessage() {
      document.getElementById('msgModal').classList.add('hidden');
    }
  </script>
</body>
</html>
